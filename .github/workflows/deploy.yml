name: Deploy perfil

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-perfil
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f build/client/index.html
          test -f build/client/ads.txt

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync to /opt/perfil
        working-directory: ui
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy.pem -p ${SSH_PORT} -o IdentitiesOnly=yes" \
            build/client/ \
            "${SSH_USER}@${SSH_HOST}:/opt/perfil/"
